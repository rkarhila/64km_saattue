[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sixtyfivekmconvoy"
version = "0.2.0"
description = "65km Convoy — board game engine with PettingZoo env and web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
]
env = [
  "pettingzoo>=1.24",
  "gymnasium>=0.29",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "pettingzoo>=1.24",
  "gymnasium>=0.29",
]
rl = [
  "torch>=2.1",
  "pettingzoo>=1.24",
  "gymnasium>=0.29",
]

[project.scripts]
convoy-selfplay = "sixtyfivekmconvoy.cli.selfplay:main"
convoy-train = "sixtyfivekmconvoy.cli.train:main"
convoy-league = "sixtyfivekmconvoy.cli.league_cli:main"
convoy-web = "sixtyfivekmconvoy.cli.web:main"
convoy-local = "sixtyfivekmconvoy.play:main"
convoy-terminal = "sixtyfivekmconvoy.cli.terminal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sixtyfivekmconvoy = ["data/cards/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
